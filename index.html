<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>헬스장 직원 체크리스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18212f;font-family:Arial,"Malgun Gothic",sans-serif}header{background:#123c2d;color:#fff;padding:20px max(16px,calc((100% - 900px)/2))}h1{font-size:24px;margin:0 0 6px}header p{margin:0;font-size:14px}main{max-width:900px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:white;border:1px solid #e0e5eb;border-radius:14px;padding:16px}h2{font-size:18px;margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label.field{font-size:13px;color:#667085;display:grid;gap:6px}input,select,textarea{font:inherit;padding:11px;border:1px solid #cbd3dd;border-radius:9px;width:100%;background:#fff;color:#18212f}.progress{height:8px;background:#e7ebef;border-radius:9px;overflow:hidden;margin-top:8px}.progress div{height:100%;width:0;background:#176b4d}.progressText{font-size:13px;text-align:right;color:#667085;margin-top:12px}.section{border:1px solid #e0e5eb;border-radius:10px;margin:10px 0;overflow:hidden}.section summary{font-weight:bold;padding:13px;cursor:pointer;background:#fafbfc}.items{padding:0 13px}.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid #eef0f3;font-size:14px;line-height:1.45}.item input{width:20px;height:20px;flex:none;margin:0;accent-color:#176b4d}.item small{display:block;color:#667085;margin-top:4px}.item.done span{text-decoration:line-through;color:#89919d}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer;background:#edf1f5}.btn.primary{background:#176b4d;color:white}.status{font-size:13px;color:#667085;margin-top:10px}.record{border:1px solid #e0e5eb;border-radius:9px;padding:12px;display:flex;justify-content:space-between;gap:10px;margin:8px 0}.record small{display:block;color:#667085;margin-top:4px}.warning{padding:12px;background:#fff8e7;border:1px solid #f1dca6;border-radius:9px;font-size:13px;line-height:1.5;margin-bottom:12px}@media(max-width:580px){.fields{grid-template-columns:1fr}main{padding:10px}.record{align-items:flex-start}}
</style></head><body>
<header><h1>헬스장 직원 체크리스트</h1><p>오픈 · 미들 · 마감 업무를 체크하고 날짜별로 저장하세요.</p></header>
<main>
<section class="card"><h2>근무 정보</h2><div class="fields">
<label class="field">직원명<input id="employee" placeholder="예: 홍길동"></label>
<label class="field">근무 날짜<input id="date" type="date"></label>
<label class="field">근무 구분<select id="shift"><option>오픈</option><option>미들</option><option>마감</option></select></label>
<label class="field">특이사항 / 미완료 사유<input id="notes" placeholder="없으면 비워두세요"></label></div>
<div class="progressText" id="progressText">0 / 0 (0%)</div><div class="progress"><div id="progressBar"></div></div></section>
<section class="card"><h2>체크리스트</h2><div class="warning">세정제는 제품 표시사항에 따라 사용하고 서로 다른 세정제를 섞지 마세요. 전기기기 내부에 물이 들어가지 않도록 주의하세요.</div><div id="checklist"></div>
<div class="buttons"><button class="btn primary" id="save">저장하기</button><button class="btn" id="load">기록 불러오기</button><button class="btn" id="csv">CSV 내보내기</button><button class="btn" id="reset">체크 초기화</button></div><div class="status" id="status"></div></section>
<section class="card"><h2>저장된 기록</h2><div class="fields"><label class="field">직원명으로 검색<input id="searchName" placeholder="직원명 입력"></label><label class="field">날짜로 검색<input id="searchDate" type="date"></label></div><div class="buttons"><button class="btn" id="search">기록 검색</button><button class="btn" id="all">전체 보기</button></div><div id="records" class="status">저장된 기록은 이 브라우저에서 검색할 수 있습니다.</div></section>
</main>
<script>
const sections=[
["오픈 - 출근 및 기본 정리",[
["출근 완료 여부를 대표님께 보고하기"],["필요시 옷 정리하기"],["실내화 분배하기"],["정수기 닦고 점검하기"],["종이컵·휴지 확인 및 보충하기"],["쓰레기통과 정수기 주변 정리하기"],["화장실 소변기 물 내리고 변기·세면대 솔로 닦기"],["화장실 바닥 세제로 물청소하기"],["청소기와 쓰레기통을 통행에 방해되지 않게 정리하기"],["탈의실 옷·수건·바닥 정리하기", "성별 구역에 맞게"],["정수기 옆 케틀벨·덤벨 정리하기"],["덤벨 3kg 위치 정리하기"],["폼롤러와 매트 정리하기"],["걸레로 정문·후문 신발장 닦기"],["남녀 가방 보관함 닦기"],["런닝머신 상단·버튼 주변 닦기"],["런닝머신 벨트 옆 발판 닦기","젖은 걸레 후 마른 수건으로 마무리"],["천국의 계단 전체 닦기"],["후문 담배꽁초·쓰레기 줍기","플라스틱 빗자루 사용"]]],
["미들 - 근무 중 수시 점검",[
["천국의 계단·런닝머신 땀 자국 닦기"],["사용 종료한 유산소 기구 TV 전원 끄기"],["기구 청소하고 틀어진 기구 원위치하기"],["카운터 앞 레그프레스 원판 한쪽당 1개씩 정리하기"],["거울 손자국 닦기"],["인포메이션 데스크 깨끗하게 관리하기"],["네이버 톡톡 확인 및 응대하기"],["홍보물 제작·게시 확인하기","전봇대 족자, 블로그, 클립 등"],["정수기 물통 확인 및 비우기"],["오래 보관 중인 신발 발견 시 사진 찍어 대표님께 보고하기"],["바닥 쓰레기 수시로 줍기"],["비누·휴지·종이컵 재고 확인하기"],["부족한 비품 카카오톡으로 보고하기"],["쿠팡 주문 시 배송 주소 확인하기"],["주문 품목·수량·도착 예정일 보고하기"]]],
["마감 - 화장실",[
["변기·소변기·세면대 세정 후 물로 마무리하기","PB-1 등 제품 표시사항 준수, 세정제 혼합 금지"],["바닥 쓸고 세제로 물청소하기","오픈 때 완료했다면 물청소 생략 가능"],["거울 깨끗하게 닦기"],["바닥 물기와 잔여 세제 확인하기"]]],
["마감 - 헬스장 내부",[
["기구·머신 표면 닦기"],["원판과 덤벨 제자리에 정리하기"],["청소기로 바닥 청소하기","청소기는 화장실에 위치"],["정수기와 주변 청소하기"],["정수기 물통 비우기"],["쓰레기통 확인 후 비우기"],["신발장 실내화 정리하기"],["옷과 수건 정리하고 부족분 채우기"],["기구 주변과 바닥에 쓰레기가 없는지 확인하기"]]],
["마감 - 샤워실",[
["샤워실 전체 세정 후 솔로 닦기"],["샤워실 옆면 누런 물때 제거하기"],["샤워실 거울 닦기"],["배수구 주변을 솔로 닦기"],["솔 뒷부분으로 바닥 물기 제거하기"],["쓰레기통 비우기"],["배수 상태와 미끄러운 구역 확인하기"]]],
["마감 - 탈의실 및 최종 보고",[
["청소기로 탈의실 바닥 청소하기"],["옷·수건을 보라색 포대에 담기"],["샤워실 앞 물기 제거 발판 교체 여부 확인하기","교체 요일: 월요일·목요일"],["음악 소리를 7~9% 정도로 줄이기","완전히 끄지 않기"],["전체 청소 상태 최종 점검하기"],["환풍기 켜지 않기"],["화장실 포함 각 구역 소등하기"],["출입문 잠금 확인하기","탈의실·화장실 문은 잠그지 않기"],["바닥에 보이는 쓰레기 줍기"],["각 구역 청소 사진 촬영하기"],["대표님께 청소 사진과 특이사항 보고하기"],["퇴근 전 체크리스트 저장하기"]]]
];
const $=id=>document.getElementById(id);
function localToday(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
$("date").value=localToday();
function render(){
 const root=$("checklist");root.innerHTML="";
 sections.forEach((sec,si)=>{const d=document.createElement("details");d.className="section";d.open=si===0;
 const sum=document.createElement("summary");sum.textContent=sec[0]+" · 0/"+sec[1].length;d.appendChild(sum);
 const items=document.createElement("div");items.className="items";
 sec[1].forEach((item,ii)=>{const lab=document.createElement("label");lab.className="item";const cb=document.createElement("input");cb.type="checkbox";cb.dataset.id=si+"-"+ii;const span=document.createElement("span");span.append(document.createTextNode(item[0]));if(item[1]){const small=document.createElement("small");small.textContent=item[1];span.appendChild(small)}cb.addEventListener("change",()=>{lab.classList.toggle("done",cb.checked);progress();});lab.append(cb,span);items.appendChild(lab)});
 d.appendChild(items);root.appendChild(d)});progress();
}
function progress(){const c=[...document.querySelectorAll('#checklist input[type=checkbox]')],done=c.filter(x=>x.checked).length,total=c.length,pct=total?Math.round(done/total*100):0;$("progressText").textContent=`${done} / ${total} (${pct}%)`;$("progressBar").style.width=pct+"%";[...document.querySelectorAll(".section")].forEach((d,i)=>{const boxes=[...d.querySelectorAll("input")];d.querySelector("summary").textContent=sections[i][0]+` · ${boxes.filter(x=>x.checked).length}/${boxes.length}`})}
function key(){return "gymcheck:"+$("date").value+":"+$("employee").value.trim().toLowerCase()+":"+$("shift").value}
function allRecords(){try{return JSON.parse(localStorage.getItem("gymcheck_records")||"{}")}catch(e){return {}}}
function current(){const checks={};document.querySelectorAll('#checklist input').forEach(c=>checks[c.dataset.id]=c.checked);return {employee:$("employee").value.trim(),date:$("date").value,shift:$("shift").value,notes:$("notes").value,checks,updated:new Date().toISOString()}}
function setStatus(s){$("status").textContent=s}
function save(){const r=current();if(!r.employee||!r.date){setStatus("직원명과 근무 날짜를 입력해주세요.");return}const a=allRecords();a[key()]={...r,id:key()};localStorage.setItem("gymcheck_records",JSON.stringify(a));setStatus("저장 완료! 이 브라우저의 저장된 기록에 보관했습니다.");searchRecords()}
function load(){const r=allRecords()[key()];if(!r){setStatus("해당 직원·날짜·근무 구분의 기록이 없습니다.");return}$("employee").value=r.employee;$("date").value=r.date;$("shift").value=r.shift;$("notes").value=r.notes||"";document.querySelectorAll('#checklist input').forEach(c=>{c.checked=!!r.checks[c.dataset.id];c.closest(".item").classList.toggle("done",c.checked)});progress();setStatus("기록을 불러왔습니다.")}
function searchRecords(){const name=$("searchName").value.trim().toLowerCase(),date=$("searchDate").value,rs=Object.values(allRecords()).filter(r=>(!name||r.employee.toLowerCase().includes(name))&&(!date||r.date===date)).sort((a,b)=>b.date.localeCompare(a.date));const root=$("records");root.innerHTML="";if(!rs.length){root.textContent="검색 결과가 없습니다.";return}rs.forEach(r=>{const row=document.createElement("div");row.className="record";const info=document.createElement("div"),done=Object.values(r.checks).filter(Boolean).length,total=Object.keys(r.checks).length;info.innerHTML="<strong>"+esc(r.date)+" · "+esc(r.employee)+" · "+esc(r.shift)+"</strong><small>"+done+"/"+total+"개 완료 · "+esc(r.notes||"특이사항 없음")+"</small>";const b=document.createElement("button");b.className="btn";b.textContent="불러오기";b.onclick=()=>{ $("employee").value=r.employee;$("date").value=r.date;$("shift").value=r.shift;$("notes").value=r.notes||"";document.querySelectorAll('#checklist input').forEach(c=>{c.checked=!!r.checks[c.dataset.id];c.closest(".item").classList.toggle("done",c.checked)});progress();setStatus("기록을 불러왔습니다.")};row.append(info,b);root.appendChild(row)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function exportCSV(){const rs=Object.values(allRecords());if(!rs.length){setStatus("내보낼 기록이 없습니다.");return}const tasks=sections.flatMap((s,si)=>s[1].map((t,ii)=>({id:si+"-"+ii,label:s[0]+" - "+t[0]})));const rows=[["날짜","직원명","근무구분","특이사항",...tasks.map(t=>t.label)]];rs.forEach(r=>rows.push([r.date,r.employee,r.shift,r.notes,...tasks.map(t=>r.checks[t.id]?"완료":"미완료")]));const csv="\uFEFF"+rows.map(row=>row.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="헬스장_체크리스트.csv";a.click();URL.revokeObjectURL(a.href)}
$("save").onclick=save;$("load").onclick=load;$("csv").onclick=exportCSV;$("reset").onclick=()=>{if(confirm("현재 체크만 초기화할까요? 저장 기록은 삭제되지 않습니다.")){document.querySelectorAll('#checklist input').forEach(c=>{c.checked=false;c.closest(".item").classList.remove("done")});progress();setStatus("체크를 초기화했습니다.")}};$("search").onclick=searchRecords;$("all").onclick=()=>{$("searchName").value="";$("searchDate").value="";searchRecords()};
$("shift").onchange=()=>{document.querySelectorAll(".section").forEach((d,i)=>d.open=sections[i][0].toLowerCase().includes($("shift").value.toLowerCase()))};
render();
</script></body></html>
